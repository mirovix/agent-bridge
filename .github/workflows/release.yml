name: Release

# Push a tag like v1.6.0 to package the server and the VS Code companion,
# then publish a GitHub Release. The app itself is the web app the server serves.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package server
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="$(node -p "require('./package.json').version")"
          NAME="agent-bridge-server-$VERSION"
          mkdir -p "dist/$NAME"
          cp -r src public scripts docs examples package.json package-lock.json README.md LICENSE "dist/$NAME/"
          rm -rf "dist/$NAME/scripts/__pycache__"
          (cd dist && zip -qr "$NAME.zip" "$NAME" && tar -czf "$NAME.tar.gz" "$NAME")
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package VS Code companion
        run: python3 scripts/build-vsix.py
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: vscode-extension/*.vsix
          if-no-files-found: error

  release:
    needs: [server, vscode]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - run: ls -la packages && (cd packages && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          name: Agent Bridge ${{ github.ref_name }}
          generate_release_notes: true
          files: packages/*
